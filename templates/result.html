<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نتيجة التوليد الذكي</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; text-align: center; }
        .container { max-width: 650px; margin: auto; background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); border: 1px solid #333; }
        .video-box { margin-top: 20px; }
        video { width: 100%; border-radius: 8px; border: 2px solid #ff9800; max-height: 400px; background: #000; }
        .duaa { font-size: 18px; color: #ffca28; margin: 15px 0; line-height: 1.6; font-weight: bold; background: #2a2a2a; padding: 15px; border-radius: 8px; }
        .btn { display: inline-block; background-color: #ff9800; color: #000; padding: 12px 25px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 25px; }
        .btn:hover { background-color: #e68900; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎥 معاينة فيديو الذكرى المُتولّد بالذكاء الاصطناعي</h2>
        
        <div class="duaa">
            "اللهم ارحم من عجزت عقولنا عن استيعاب فراقهم، واجعل قبورهم برداً وسلاماً."
        </div>

        <div class="video-box">
            {% if video_url %}
            <video controls autoplay loop>
                <source src="{{ video_url }}" type="video/mp4">
                متصفحك لا يدعم عرض الفيديو.
            </video>
            {% else: -->
            <p style="color: #ff5252;">عذراً، لم يتم إرجاع رابط فيديو من نموذج الذكاء الاصطناعي.</p>
            {% endif %}
        </div>

        <a href="/" class="btn">🔙 العودة لإنشاء ذكرى أخرى</a>
    </div>
</body>
</html>
