<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نتيجة التوليد والذكاء الاصطناعي</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; text-align: center; }
        .container { max-width: 650px; margin: auto; background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .success-box { background: #252525; padding: 20px; border-radius: 8px; border: 1px solid #4caf50; margin-top: 20px; }
        video, img { width: 100%; border-radius: 8px; margin-top: 15px; }
        .btn { display: inline-block; background-color: #00bcd4; color: #000; padding: 12px 25px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 20px; }
        .btn:hover { background-color: #008ba3; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎉 تم معالجة وتوليد الذكرى بنجاح!</h2>
        <p style="color: #aaa;">قام الذكاء الاصطناعي بتحليل الصور، ضبط الملابس، وتوليد المشهد المطلوب.</p>

        <div class="success-box">
            <h3 style="color: #ff9800;">🕊️ معاينة فيديو الذكرى الناتج:</h3>
            <!-- عرض فيديو تجريبي وهمي كمثال للنتيجة -->
            <video controls autoplay muted loop>
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                متصفحك لا يدعم عرض الفيديو.
            </video>
            <p style="margin-top: 15px; color: #4caf50;">الحالة: تم إنجاز الفيديو والحركة والملابس المطلوبة بدقة.</p>
        </div>

        <a href="/" class="btn">🔙 العودة لإنشاء ذكرى أخرى</a>
    </div>
</body>
</html>
